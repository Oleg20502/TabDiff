name: tabdiff
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  # MKL 2024.1+ drops iJIT_NotifyEvent; older PyTorch builds then fail at import with
  # "undefined symbol: iJIT_NotifyEvent" in libtorch_cpu.so (pytorch#123097).
  - "mkl<2024.1"
  - pytorch=2.0.1
  - torchvision==0.15.2
  - torchaudio==2.0.2
  - pytorch-cuda=11.7
  - numpy<2
  - pip
  - pip:
    - pandas
    - pyyaml
    - scikit-learn
    - scipy
    - icecream
    - xlrd
    - category_encoders
    - imbalanced-learn
    - kaggle
    - transformers
    - datasets
    - peft==0.9.0
    - ml_collections
    - sdmetrics
    - prdc
    - rdt
    - openpyxl
    - xgboost
    - wandb==0.17.3
    - tensorboard>=2.14.0
    - kaleido
